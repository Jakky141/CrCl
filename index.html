<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คำนวณ CrCl</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col items-center">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-600 p-6 text-white text-center">
            <h1 class="text-3xl font-bold">คำนวณ CrCl</h1>
            <p class="text-blue-100 mt-2">(Cockcroft-Gault)</p>
        </div>

        <!-- Form -->
        <div class="p-6 space-y-5">
            <div>
                <label class="block text-xl font-semibold text-gray-700 mb-2">เพศ</label>
                <select id="gender" onchange="calculate()" class="w-full text-2xl p-4 border-2 border-gray-300 rounded-xl bg-white outline-none">
                    <option value="male">ชาย</option>
                    <option value="female">หญิง</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xl font-semibold text-gray-700 mb-2">น้ำหนัก (kg)</label>
                <input type="number" id="weight" oninput="calculate()" inputmode="decimal" placeholder="0" class="w-full text-2xl p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xl font-semibold text-gray-700 mb-2">อายุ (ปี)</label>
                <input type="number" id="age" oninput="calculate()" inputmode="numeric" placeholder="0" class="w-full text-2xl p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 outline-none">
            </div>

            <div>
                <label class="block text-xl font-semibold text-gray-700 mb-2">Creatinine (mg/dL)</label>
                <input type="number" id="creatinine" oninput="calculate()" inputmode="decimal" placeholder="0" class="w-full text-2xl p-4 border-2 border-gray-300 rounded-xl focus:border-blue-500 outline-none">
            </div>
        </div>

        <!-- Result -->
        <div id="resultBox" class="hidden bg-gray-50 p-6 text-center border-t-2 border-gray-200">
            <p class="text-lg text-gray-600">ค่า CrCl คือ:</p>
            <div id="result" class="text-5xl font-bold text-blue-700 my-2">0</div>
            <p class="text-xl text-gray-600">ml/min</p>
        </div>
    </div>

    <script>
        function calculate() {
            const weight = parseFloat(document.getElementById('weight').value);
            const age = parseFloat(document.getElementById('age').value);
            const cr = parseFloat(document.getElementById('creatinine').value);
            const gender = document.getElementById('gender').value;

            const resultEl = document.getElementById('result');
            const resultBox = document.getElementById('resultBox');

            if (isNaN(weight) || isNaN(age) || isNaN(cr) || cr <= 0) {
                resultBox.classList.add('hidden');
                return;
            }

            // Cockcroft-Gault formula
            let crcl = ((140 - age) * weight) / (72 * cr);
            if (gender === 'female') {
                crcl *= 0.85;
            }
            
            resultEl.innerText = crcl.toFixed(1);
            resultBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
